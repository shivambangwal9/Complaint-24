services:
  - type: web
    name: complain24
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: complain24.db
      - key: PYTHON_VERSION
        value: 3.11.0
