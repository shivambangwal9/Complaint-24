<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Complain 24</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .dashboard-layout { display: flex; gap: 2rem; }
    .sidebar { width: 250px; flex-shrink: 0; }
    .main-content { flex-grow: 1; }
    .stat-card { padding: 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .stat-number { font-size: 2rem; font-weight: 700; line-height: 1; }
  </style>
</head>
<body style="background-color: var(--bg-color);">
  <!-- Navbar injected by JS -->
  
  <main>
    <div class="container dashboard-layout">
      
      <aside class="sidebar">
        <div class="card" style="position: sticky; top: calc(var(--nav-height) + 2rem);">
          <div class="text-center mb-6 pb-6" style="border-bottom: 1px solid var(--border-color);">
            <div id="profile-initials" style="width: 64px; height: 64px; background: #1e293b; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.5rem; font-weight: bold;">
              AD
            </div>
            <h3 id="profile-name" class="text-sm">Super Admin</h3>
            <p id="profile-dept" class="text-sm mb-0">System Control</p>
          </div>
          <nav style="display: flex; flex-direction: column; gap: 0.5rem;">
            <a href="#" class="btn btn-primary" style="justify-content: flex-start;">All Complaints</a>
          </nav>
        </div>
      </aside>

      <section class="main-content">
        <h1 class="mb-6">System Analytics & Control</h1>
        
        <div class="grid grid-cols-3 mb-8">
          <div class="card stat-card" style="border-left: 4px solid var(--primary-color);">
            <div>
              <div class="text-sm text-secondary font-semibold mb-1">Total Complaints</div>
              <div class="stat-number text-primary" id="t-total">0</div>
            </div>
            <div style="padding: 1rem; background: #e0f2fe; border-radius: 50%; color: var(--primary-color);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </div>
          </div>
          
          <div class="card stat-card" style="border-left: 4px solid var(--accent-success);">
            <div>
              <div class="text-sm text-secondary font-semibold mb-1">Resolved</div>
              <div class="stat-number" style="color: var(--accent-success);" id="t-resolved">0</div>
            </div>
            <div style="padding: 1rem; background: #d1fae5; border-radius: 50%; color: var(--accent-success);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </div>

          <div class="card stat-card" style="border-left: 4px solid var(--accent-warning);">
            <div>
              <div class="text-sm text-secondary font-semibold mb-1">Pending/Progress</div>
              <div class="stat-number" style="color: var(--accent-warning);" id="t-pending">0</div>
            </div>
            <div style="padding: 1rem; background: #fef3c7; border-radius: 50%; color: var(--accent-warning);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
          </div>
        </div>

        <div class="card" style="padding: 0; overflow: hidden; margin-bottom: 2rem;">
          <div class="d-flex justify-between align-center p-4" style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 1rem;">
            <h2 class="text-lg mb-0">All Complaints</h2>
            <div class="d-flex gap-2 align-center">
              <select id="filterStatus" class="form-control" style="width: auto; padding: 0.25rem 2rem 0.25rem 0.5rem;" onchange="renderTable()">
                <option value="All">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Resolved">Resolved</option>
              </select>
              <select id="filterPriority" class="form-control" style="width: auto; padding: 0.25rem 2rem 0.25rem 0.5rem;" onchange="renderTable()">
                <option value="All">All Priorities</option>
                <option value="Urgent">Urgent Only</option>
                <option value="High">High Priority</option>
                <option value="Normal">Normal</option>
              </select>
              <button class="btn btn-outline text-sm" style="padding: 0.35rem 0.75rem;" onclick="exportDataToCSV()">Export CSV</button>
            </div>
          </div>
          <table style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead style="background-color: rgba(255, 255, 255, 0.05);">
              <tr>
                <th style="padding: 1rem; border-bottom: 1px solid var(--border-color);">ID & Title</th>
                <th style="padding: 1rem; border-bottom: 1px solid var(--border-color);">Category</th>
                <th style="padding: 1rem; border-bottom: 1px solid var(--border-color);">Priority</th>
                <th style="padding: 1rem; border-bottom: 1px solid var(--border-color);">Status</th>
                <th style="padding: 1rem; border-bottom: 1px solid var(--border-color); text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="complaintTableBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>

      </section>
    </div>
  </main>

  <!-- Update Modal -->
  <div id="updateModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 500px;">
      <h2 class="mb-4">Update Status</h2>
      <form id="updateForm">
        <input type="hidden" id="updateId">
        <div class="form-group">
          <label class="form-label">New Status</label>
          <select id="updateStatus" class="form-control" required>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Admin Remarks</label>
          <textarea id="updateRemarks" class="form-control" placeholder="Describe the action taken..." required></textarea>
        </div>
        <div class="d-flex justify-between mt-6">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Update</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = JSON.parse(localStorage.getItem('citizen_user'));
      if (user) {
        if (document.getElementById('profile-name')) document.getElementById('profile-name').textContent = user.name;
        if (document.getElementById('profile-dept')) document.getElementById('profile-dept').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1) + ' Dashboard';
        if (document.getElementById('profile-initials')) {
          const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase();
          document.getElementById('profile-initials').textContent = initials;
        }
      }
      
      await loadStats();
      renderTable();
    });

    let complaintsData = [];

    async function loadStats() {
      try {
        const response = await fetch(window.API_BASE + '/api/complaints', { cache: 'no-store' });
        complaintsData = await response.json();
      } catch (err) {
        console.error("Failed to load complaints from API", err);
      }
      
      const total = complaintsData.length;
      const resolved = complaintsData.filter(c => c.status === 'Resolved').length;
      const pending = total - resolved;

      document.getElementById('t-total').textContent = total;
      document.getElementById('t-resolved').textContent = resolved;
      document.getElementById('t-pending').textContent = pending;
    }

    async function renderTable() {
      if (complaintsData.length === 0) {
        try {
          const response = await fetch(window.API_BASE + '/api/complaints', { cache: 'no-store' });
          complaintsData = await response.json();
        } catch (err) {
          console.error("Failed to fetch complaints", err);
        }
      }
      
      const tbody = document.getElementById('complaintTableBody');
      tbody.innerHTML = '';

      const filterStatus = document.getElementById('filterStatus').value;
      const filterPriority = document.getElementById('filterPriority').value;

      // Filter logic
      const activeComplaints = complaintsData.filter(c => {
        let matchStatus = filterStatus === 'All' ? true : c.status === filterStatus;
        let matchPriority = filterPriority === 'All' ? true : c.priority === filterPriority;
        return matchStatus && matchPriority;
      });

      activeComplaints.forEach(c => {
        let pClass = 'badge-pending';
        if (c.priority === 'Urgent') pClass = 'badge-urgent';
        if (c.priority === 'High') pClass = 'badge-progress';

        let sClass = 'badge-pending';
        if (c.status === 'In Progress') sClass = 'badge-progress';
        if (c.status === 'Resolved') sClass = 'badge-resolved';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="padding: 1rem; border-bottom: 1px solid var(--border-color);">
            <div class="font-semibold text-primary">${c.id}</div>
            <div class="text-sm">${c.title}</div>
          </td>
          <td style="padding: 1rem; border-bottom: 1px solid var(--border-color);">${c.category}</td>
          <td style="padding: 1rem; border-bottom: 1px solid var(--border-color);"><span class="badge ${pClass}">${c.priority}</span></td>
          <td style="padding: 1rem; border-bottom: 1px solid var(--border-color);"><span class="badge ${sClass}">${c.status}</span></td>
          <td style="padding: 1rem; border-bottom: 1px solid var(--border-color); text-align: right;">
            <button class="btn btn-outline text-sm" style="padding: 0.25rem 0.5rem;" onclick="openModal('${c.id}', '${c.status}')">Update</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openModal(id, currentStatus) {
      document.getElementById('updateId').value = id;
      document.getElementById('updateStatus').value = currentStatus;
      
      const complaint = complaintsData.find(c => c.id === id);
      const photoDiv = document.getElementById('modalPhoto');
      if (photoDiv) photoDiv.remove();
      
      if (complaint && complaint.photo_url) {
          const pDiv = document.createElement('div');
          pDiv.id = 'modalPhoto';
          pDiv.className = 'mb-4 text-center';
          pDiv.innerHTML = `<a href="${window.API_BASE}${complaint.photo_url}" target="_blank" class="text-sm font-semibold" style="color: var(--primary-color);">📎 View Uploaded Photo</a>`;
          document.getElementById('updateForm').insertBefore(pDiv, document.getElementById('updateForm').firstChild);
      }
      
      document.getElementById('updateModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('updateModal').style.display = 'none';
      document.getElementById('updateRemarks').value = '';
    }

    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('updateId').value;
      const newStatus = document.getElementById('updateStatus').value;
      const remarks = document.getElementById('updateRemarks').value;
      
      // Get token from both possible storage locations
      let token = localStorage.getItem('token');
      if (!token) {
        const userObj = JSON.parse(localStorage.getItem('citizen_user') || '{}');
        token = userObj.token || '';
      }
      
      if (!token) {
        alert('Your session has expired. Please log in again.');
        window.location.href = 'login.html';
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      try {
        const response = await fetch(window.API_BASE + `/api/complaints/${id}`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            status: newStatus,
            remarks: remarks,
            resolvedDate: newStatus === 'Resolved' ? new Date().toISOString() : null
          })
        });
        
        if (response.status === 401) {
          alert('Session expired or unauthorized. Please log in again.');
          window.location.href = 'login.html';
          return;
        }

        const result = await response.json();
        if (result.success) {
          closeModal();
          await loadStats();
          renderTable();
          // Show a brief success toast
          const toast = document.createElement('div');
          toast.style.cssText = 'position:fixed;bottom:2rem;right:2rem;background:linear-gradient(135deg,#10b981,#06b6d4);color:white;padding:1rem 1.5rem;border-radius:0.75rem;font-weight:600;z-index:9999;animation:fadeIn 0.3s ease;box-shadow:0 4px 20px rgba(0,0,0,0.4);';
          toast.textContent = `✅ Complaint ${id} updated to "${newStatus}"`;
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 3000);
        } else {
          alert('Update failed: ' + (result.error || 'Unknown error. Check console.'));
          console.error('Update error:', result);
        }
      } catch (err) {
        console.error(err);
        alert('Network error: Could not reach the server. Make sure the backend is running.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Update';
      }
    });

    async function exportDataToCSV() {
      if (!complaintsData.length) {
        alert("No data to export.");
        return;
      }
      const headers = ['ID', 'Title', 'Category', 'Priority', 'Status', 'Date', 'Department'];
      const csvRows = [headers.join(',')];
      
      complaintsData.forEach(c => {
        const row = [
          c.id,
          `"${c.title.replace(/"/g, '""')}"`,
          `"${c.category}"`,
          c.priority,
          c.status,
          c.date,
          `"${c.department}"`
        ];
        csvRows.push(row.join(','));
      });
      
      const blob = new Blob([csvRows.join('\\n')], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('hidden', '');
      a.setAttribute('href', url);
      a.setAttribute('download', 'complaints_export.csv');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
